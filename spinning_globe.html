<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earth</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #000407;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
  }

  #stars-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  .globe-wrapper {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: fadeIn 2s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.94); }
    to   { opacity: 1; transform: scale(1); }
  }

  .canvas-stack {
    position: relative;
    width: 560px;
    height: 560px;
  }
  .canvas-stack canvas {
    position: absolute;
    top: 0; left: 0;
  }
  #atmos-canvas  { z-index: 1; pointer-events: none; }
  #globe-canvas  { z-index: 2; cursor: grab; }
  #light-canvas  { z-index: 3; pointer-events: none; }

  #globe-canvas:active { cursor: grabbing; }

  .controls {
    margin-top: 24px;
    display: flex;
    gap: 10px;
  }
  .controls button {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.55);
    padding: 6px 18px;
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.25s;
    letter-spacing: 0.3px;
  }
  .controls button:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.8);
  }
  .controls button.on {
    border-color: rgba(100,180,255,0.35);
    color: rgba(140,200,255,0.8);
  }

  .hint {
    margin-top: 12px;
    font-size: 10px;
    color: rgba(255,255,255,0.18);
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<canvas id="stars-canvas"></canvas>

<div class="globe-wrapper">
  <div class="canvas-stack">
    <canvas id="atmos-canvas" width="560" height="560"></canvas>
    <canvas id="globe-canvas" width="560" height="560"></canvas>
    <canvas id="light-canvas" width="560" height="560"></canvas>
  </div>

  <div class="controls">
    <button id="btn-toggle" class="on">⏸ Pause</button>
    <button id="btn-direction">↻ Reverse</button>
    <button id="btn-clouds" class="on">☁ Clouds</button>
  </div>
  <p class="hint">drag to rotate · scroll to zoom</p>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://unpkg.com/topojson-client@3"></script>

<script>
// ╔══════════════════════════════════════════════════════════════╗
// ║                  PARAMETERS                                  ║
// ╚══════════════════════════════════════════════════════════════╝

const SIZE          = 560;
const GLOBE_RADIUS  = 245;
const TILT          = 23.4;
const ROTATION_SPEED = 0.22;

// Sun direction (normalized, in screen-space: light from upper-left)
const SUN_X = -0.55;
const SUN_Y = -0.6;

// Realistic earth palette
const OCEAN_DEEP    = "#09213a";
const OCEAN_MID     = "#0c3158";
const OCEAN_SHALLOW = "#134a7c";
const LAND_GREEN    = "#2d6a3e";
const LAND_LIGHT    = "#3d8a4f";
const LAND_STROKE   = "#22573a";
const BORDER_COLOR  = "rgba(60,80,60,0.35)";
const COAST_COLOR   = "#1a4a6e";

// Atmosphere
const ATMOS_COLOR   = "rgba(80, 160, 255, 0.12)";
const ATMOS_EDGE    = "rgba(100, 180, 255, 0.35)";

const STAR_COUNT    = 400;

// ╔══════════════════════════════════════════════════════════════╗
// ║                      STARS                                   ║
// ╚══════════════════════════════════════════════════════════════╝

const starsC  = document.getElementById("stars-canvas");
const starsX  = starsC.getContext("2d");

function initStars() {
  starsC.width  = window.innerWidth;
  starsC.height = window.innerHeight;
  const arr = [];
  for (let i = 0; i < STAR_COUNT; i++) {
    arr.push({
      x: Math.random() * starsC.width,
      y: Math.random() * starsC.height,
      r: Math.random() * 1.1 + 0.15,
      base: Math.random() * 0.5 + 0.1,
      speed: Math.random() * 0.003 + 0.001,
      phase: Math.random() * Math.PI * 2,
      // Subtle color tint
      hue: Math.random() > 0.85 ? (Math.random() > 0.5 ? 30 : 220) : 0,
      sat: Math.random() > 0.85 ? 40 : 0,
    });
  }
  return arr;
}
let stars = initStars();
window.addEventListener("resize", () => { stars = initStars(); });

function drawStars(t) {
  starsX.clearRect(0, 0, starsC.width, starsC.height);
  for (const s of stars) {
    const a = s.base + Math.sin(t * s.speed + s.phase) * 0.12;
    starsX.beginPath();
    starsX.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    if (s.hue) {
      starsX.fillStyle = `hsla(${s.hue}, ${s.sat}%, 85%, ${Math.max(0.05, a)})`;
    } else {
      starsX.fillStyle = `rgba(220, 235, 255, ${Math.max(0.05, a)})`;
    }
    starsX.fill();
  }
}

// ╔══════════════════════════════════════════════════════════════╗
// ║                    GLOBE                                     ║
// ╚══════════════════════════════════════════════════════════════╝

const gCanvas = document.getElementById("globe-canvas");
const gCtx    = gCanvas.getContext("2d");
const aCanvas = document.getElementById("atmos-canvas");
const aCtx    = aCanvas.getContext("2d");
const lCanvas = document.getElementById("light-canvas");
const lCtx    = lCanvas.getContext("2d");

const cx = SIZE / 2, cy = SIZE / 2, R = GLOBE_RADIUS;
let rotation  = [0, -TILT, 0];
let autoRotate = true;
let direction  = 1;
let showClouds = true;

const projection = d3.geoOrthographic()
  .scale(R).translate([cx, cy]).clipAngle(90).rotate(rotation);

const path = d3.geoPath(projection, gCtx);
const graticule = d3.geoGraticule().step([30, 30])();

let land, borders, coastMesh;

// ╔══════════════════════════════════════════════════════════════╗
// ║               PROCEDURAL CLOUDS                              ║
// ╚══════════════════════════════════════════════════════════════╝

// Simple seeded pseudo-random noise for cloud bands
function simpleNoise(x, y, seed) {
  const n = Math.sin(x * 12.9898 + y * 78.233 + seed) * 43758.5453;
  return n - Math.floor(n);
}

function fbm(x, y, seed) {
  let v = 0, amp = 0.5, freq = 1;
  for (let i = 0; i < 4; i++) {
    v += amp * simpleNoise(x * freq, y * freq, seed + i * 17.3);
    amp *= 0.5;
    freq *= 2.1;
  }
  return v;
}

// Pre-generate cloud points on a sphere
const CLOUD_POINTS = [];
const CLOUD_SEED = 42;
for (let lat = -80; lat <= 80; lat += 2.5) {
  for (let lon = -180; lon < 180; lon += 3) {
    const n = fbm(lon * 0.015, lat * 0.025, CLOUD_SEED);
    // Create cloud bands near certain latitudes (ITCZ, mid-latitude)
    const latFactor =
      Math.exp(-((lat - 5) ** 2) / 400) * 0.4 +     // ITCZ
      Math.exp(-((lat - 45) ** 2) / 500) * 0.35 +    // northern mid-lat
      Math.exp(-((lat + 40) ** 2) / 500) * 0.3 +     // southern mid-lat
      0.12;
    const opacity = Math.max(0, (n - 0.38) * latFactor * 2.8);
    if (opacity > 0.02) {
      CLOUD_POINTS.push({ coords: [lon, lat], opacity: Math.min(opacity, 0.6) });
    }
  }
}

let cloudOffset = 0;

function drawClouds() {
  if (!showClouds) return;
  cloudOffset += 0.008;

  gCtx.save();
  gCtx.beginPath();
  gCtx.arc(cx, cy, R, 0, Math.PI * 2);
  gCtx.clip();

  for (const cp of CLOUD_POINTS) {
    const lon = cp.coords[0] + cloudOffset * 8;
    const pr = projection([lon, cp.coords[1]]);
    if (!pr) continue;
    const d = d3.geoDistance([lon, cp.coords[1]], projection.invert([cx, cy]));
    if (d > Math.PI / 2) continue;

    const edgeFade = Math.cos(d);
    const a = cp.opacity * edgeFade * 0.55;
    if (a < 0.01) continue;

    gCtx.beginPath();
    gCtx.arc(pr[0], pr[1], 3.5 + cp.opacity * 3, 0, Math.PI * 2);
    gCtx.fillStyle = `rgba(255, 255, 255, ${a})`;
    gCtx.fill();
  }
  gCtx.restore();
}

// ╔══════════════════════════════════════════════════════════════╗
// ║               ATMOSPHERE GLOW                                ║
// ╚══════════════════════════════════════════════════════════════╝

function drawAtmosphere() {
  aCtx.clearRect(0, 0, SIZE, SIZE);

  // Outer atmospheric haze
  for (let i = 3; i >= 0; i--) {
    const spread = R + 12 + i * 10;
    const grad = aCtx.createRadialGradient(cx, cy, R - 5, cx, cy, spread);
    grad.addColorStop(0, "transparent");
    grad.addColorStop(0.5, "transparent");
    grad.addColorStop(0.82, `rgba(80, 160, 255, ${0.025 + i * 0.01})`);
    grad.addColorStop(1, "transparent");
    aCtx.beginPath();
    aCtx.arc(cx, cy, spread, 0, Math.PI * 2);
    aCtx.fillStyle = grad;
    aCtx.fill();
  }

  // Fresnel-like blue edge glow (brighter on the limb)
  const fresnel = aCtx.createRadialGradient(cx, cy, R * 0.7, cx, cy, R + 3);
  fresnel.addColorStop(0, "transparent");
  fresnel.addColorStop(0.75, "transparent");
  fresnel.addColorStop(0.92, "rgba(90, 170, 255, 0.08)");
  fresnel.addColorStop(0.98, ATMOS_EDGE);
  fresnel.addColorStop(1, "rgba(70, 140, 255, 0.1)");
  aCtx.beginPath();
  aCtx.arc(cx, cy, R + 3, 0, Math.PI * 2);
  aCtx.fillStyle = fresnel;
  aCtx.fill();
}

// ╔══════════════════════════════════════════════════════════════╗
// ║                 LIGHTING OVERLAY                             ║
// ╚══════════════════════════════════════════════════════════════╝

function drawLighting() {
  lCtx.clearRect(0, 0, SIZE, SIZE);

  lCtx.save();
  lCtx.beginPath();
  lCtx.arc(cx, cy, R, 0, Math.PI * 2);
  lCtx.clip();

  // Sun position offset for the lighting gradient
  const sunScreenX = cx + SUN_X * R * 0.7;
  const sunScreenY = cy + SUN_Y * R * 0.7;

  // Diffuse illumination: bright on sun-facing side, dark on shadow side
  const diffuse = lCtx.createRadialGradient(
    sunScreenX, sunScreenY, 0,
    sunScreenX, sunScreenY, R * 2.2
  );
  diffuse.addColorStop(0, "rgba(255, 252, 240, 0.10)");
  diffuse.addColorStop(0.25, "rgba(255, 250, 235, 0.05)");
  diffuse.addColorStop(0.5, "transparent");
  diffuse.addColorStop(0.75, "rgba(0, 0, 15, 0.15)");
  diffuse.addColorStop(1, "rgba(0, 0, 10, 0.35)");

  lCtx.fillStyle = diffuse;
  lCtx.fillRect(0, 0, SIZE, SIZE);

  // Specular highlight (sharp glint)
  const specX = cx + SUN_X * R * 0.4;
  const specY = cy + SUN_Y * R * 0.4;
  const spec = lCtx.createRadialGradient(specX, specY, 0, specX, specY, R * 0.55);
  spec.addColorStop(0, "rgba(255, 255, 255, 0.06)");
  spec.addColorStop(0.3, "rgba(255, 255, 255, 0.02)");
  spec.addColorStop(1, "transparent");
  lCtx.fillStyle = spec;
  lCtx.fillRect(0, 0, SIZE, SIZE);

  // Terminator darkening (edge shadow gradual transition)
  const terminator = lCtx.createLinearGradient(
    cx + SUN_X * R * 1.6, cy + SUN_Y * R * 1.6,
    cx - SUN_X * R * 1.6, cy - SUN_Y * R * 1.6
  );
  terminator.addColorStop(0, "transparent");
  terminator.addColorStop(0.45, "transparent");
  terminator.addColorStop(0.58, "rgba(0, 0, 20, 0.12)");
  terminator.addColorStop(0.72, "rgba(0, 0, 15, 0.28)");
  terminator.addColorStop(1, "rgba(0, 2, 12, 0.45)");
  lCtx.fillStyle = terminator;
  lCtx.fillRect(0, 0, SIZE, SIZE);

  lCtx.restore();

  // Rim light on the sun-facing edge
  lCtx.beginPath();
  lCtx.arc(cx, cy, R, 0, Math.PI * 2);
  lCtx.strokeStyle = "rgba(120, 180, 255, 0.12)";
  lCtx.lineWidth = 1.5;
  lCtx.stroke();
}

// ╔══════════════════════════════════════════════════════════════╗
// ║                     RENDER                                   ║
// ╚══════════════════════════════════════════════════════════════╝

function draw(t) {
  if (autoRotate) {
    rotation[0] += ROTATION_SPEED * direction;
    projection.rotate(rotation);
  }

  drawStars(t);
  drawAtmosphere();

  // --- Globe surface ---
  gCtx.clearRect(0, 0, SIZE, SIZE);

  // Ocean with depth gradient
  gCtx.save();
  gCtx.beginPath();
  gCtx.arc(cx, cy, R, 0, Math.PI * 2);
  gCtx.clip();

  const oceanGrad = gCtx.createRadialGradient(
    cx + SUN_X * R * 0.4, cy + SUN_Y * R * 0.4, 0, cx, cy, R
  );
  oceanGrad.addColorStop(0, OCEAN_SHALLOW);
  oceanGrad.addColorStop(0.4, OCEAN_MID);
  oceanGrad.addColorStop(1, OCEAN_DEEP);
  gCtx.fillStyle = oceanGrad;
  gCtx.fillRect(0, 0, SIZE, SIZE);
  gCtx.restore();

  if (land) {
    // Subtle grid (very faint like real satellite imagery)
    gCtx.beginPath();
    path(graticule);
    gCtx.strokeStyle = "rgba(100, 160, 200, 0.04)";
    gCtx.lineWidth = 0.4;
    gCtx.stroke();

    // Land fill with slight gradient illusion
    gCtx.beginPath();
    path(land);
    gCtx.fillStyle = LAND_GREEN;
    gCtx.fill();

    // Land highlight edges
    gCtx.beginPath();
    path(land);
    gCtx.strokeStyle = LAND_LIGHT;
    gCtx.lineWidth = 0.3;
    gCtx.stroke();

    // Coastlines
    gCtx.beginPath();
    path(coastMesh);
    gCtx.strokeStyle = COAST_COLOR;
    gCtx.lineWidth = 0.6;
    gCtx.stroke();

    // Borders (very subtle)
    gCtx.beginPath();
    path(borders);
    gCtx.strokeStyle = BORDER_COLOR;
    gCtx.lineWidth = 0.2;
    gCtx.stroke();

    // Clouds
    drawClouds();
  }

  // Globe edge (very subtle, like real photo)
  gCtx.beginPath();
  gCtx.arc(cx, cy, R, 0, Math.PI * 2);
  gCtx.strokeStyle = "rgba(60, 120, 180, 0.18)";
  gCtx.lineWidth = 0.8;
  gCtx.stroke();

  // Lighting + shadow overlay
  drawLighting();

  requestAnimationFrame(draw);
}

// ╔══════════════════════════════════════════════════════════════╗
// ║                INTERACTION                                   ║
// ╚══════════════════════════════════════════════════════════════╝

let dragging = false, dragStart = [0,0], rotStart = [0,0];
let velX = 0, velY = 0, lastMoveX = 0, lastMoveY = 0;

gCanvas.addEventListener("mousedown", e => {
  dragging = true;
  autoRotate = false;
  velX = 0; velY = 0;
  dragStart = [e.clientX, e.clientY];
  rotStart  = [rotation[0], rotation[1]];
  lastMoveX = e.clientX;
  lastMoveY = e.clientY;
  document.getElementById("btn-toggle").textContent = "▶ Play";
  document.getElementById("btn-toggle").classList.remove("on");
});

gCanvas.addEventListener("mousemove", e => {
  if (!dragging) return;
  const dx = e.clientX - dragStart[0];
  const dy = e.clientY - dragStart[1];
  rotation[0] = rotStart[0] - dx * 0.32;
  rotation[1] = Math.max(-90, Math.min(90, rotStart[1] + dy * 0.32));
  projection.rotate(rotation);
  velX = (e.clientX - lastMoveX) * 0.15;
  velY = (e.clientY - lastMoveY) * 0.15;
  lastMoveX = e.clientX;
  lastMoveY = e.clientY;
});

window.addEventListener("mouseup", () => {
  if (!dragging) return;
  dragging = false;
  // Inertia
  if (Math.abs(velX) > 0.02 || Math.abs(velY) > 0.02) {
    const decay = () => {
      velX *= 0.955;
      velY *= 0.955;
      rotation[0] -= velX;
      rotation[1] = Math.max(-90, Math.min(90, rotation[1] + velY));
      projection.rotate(rotation);
      if (Math.abs(velX) > 0.005 || Math.abs(velY) > 0.005)
        requestAnimationFrame(decay);
    };
    requestAnimationFrame(decay);
  }
});

gCanvas.addEventListener("wheel", e => {
  e.preventDefault();
  const s = projection.scale();
  projection.scale(Math.max(110, Math.min(R * 2.5, s - e.deltaY * 0.35)));
}, { passive: false });

// Touch support
gCanvas.addEventListener("touchstart", e => {
  e.preventDefault();
  const t = e.touches[0];
  gCanvas.dispatchEvent(new MouseEvent("mousedown", { clientX: t.clientX, clientY: t.clientY }));
}, { passive: false });
gCanvas.addEventListener("touchmove", e => {
  e.preventDefault();
  const t = e.touches[0];
  gCanvas.dispatchEvent(new MouseEvent("mousemove", { clientX: t.clientX, clientY: t.clientY }));
}, { passive: false });
gCanvas.addEventListener("touchend", () => {
  window.dispatchEvent(new MouseEvent("mouseup"));
});

// ╔══════════════════════════════════════════════════════════════╗
// ║                    CONTROLS                                  ║
// ╚══════════════════════════════════════════════════════════════╝

document.getElementById("btn-toggle").addEventListener("click", function () {
  autoRotate = !autoRotate;
  this.textContent = autoRotate ? "⏸ Pause" : "▶ Play";
  this.classList.toggle("on", autoRotate);
});

document.getElementById("btn-direction").addEventListener("click", function () {
  direction *= -1;
  this.textContent = direction === 1 ? "↻ Reverse" : "↺ Reverse";
});

document.getElementById("btn-clouds").addEventListener("click", function () {
  showClouds = !showClouds;
  this.textContent = showClouds ? "☁ Clouds" : "☁ No Clouds";
  this.classList.toggle("on", showClouds);
});

// ╔══════════════════════════════════════════════════════════════╗
// ║                      BOOT                                    ║
// ╚══════════════════════════════════════════════════════════════╝

d3.json("https://unpkg.com/world-atlas@2/countries-110m.json").then(world => {
  land      = topojson.feature(world, world.objects.countries);
  borders   = topojson.mesh(world, world.objects.countries, (a, b) => a !== b);
  coastMesh = topojson.mesh(world, world.objects.countries);
  requestAnimationFrame(draw);
});
</script>
</body>
</html>
